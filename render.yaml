# Render blueprint for the InviteFlow backend API.
# Import this repo in Render → "New +" → "Blueprint", and it provisions the
# web service below. Fill in the `sync: false` secrets in the dashboard.
#
# NOTE: create the database schema once before/at first deploy (see docs/DEPLOYMENT.md):
#   DATABASE_URL="<cloud db>" npx prisma db push   (run locally, or as a Render pre-deploy command)

services:
  - type: web
    name: inviteflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; env.ts reads it.
      - key: DATABASE_URL
        sync: false # paste your Azure SQL / cloud SQL Server connection string
      # Strong secrets auto-generated by Render (satisfies the production check).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Set these to your deployed FRONTEND URL after you deploy it to Vercel.
      - key: APP_URL
        sync: false # e.g. https://inviteflow.vercel.app
      - key: CORS_ORIGINS
        sync: false # e.g. https://inviteflow.vercel.app
      # Background scheduler runs in-process on this single web instance.
      - key: SCHEDULER
        value: inline
      - key: WORKER_POLL_MS
        value: "30000"
      # AI + WhatsApp — leave empty to use the built-in mock providers.
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
